# Dependency lock for the juniper-recurrence CONTAINER IMAGE (container-registry rollout, 6e).
#
# Before this file existed the Dockerfile ran a bare ``pip install ".[observability]"``, so the
# image's contents were whatever PyPI happened to serve at build time: two builds of the same
# commit could ship different dependency versions, and a bad upstream release reached the image
# with nothing pinned to stop it. That is the reproducibility hole this closes.
#
# There is deliberately NO torch here. The LMU memory is a fixed linear recurrence (numpy only),
# so ``util/check_image_cpu_only.py`` runs against this image with ``EXPECT_TORCH=absent`` --
# which also means this repo cannot exhibit the CUDA-by-re-resolution shape that cost
# juniper-cascor-worker its 2026-09-07 image, because torch is never in scope for the resolution.
#
# Regeneration command (run from INSIDE juniper-recurrence/, the image's build context):
#   rm -f requirements.lock          # uv reads an existing -o file as extra constraints
#   uv pip compile pyproject.toml \
#     --extra observability \
#     --python-version 3.13 \
#     -o requirements.lock
#   (then restore this header: uv overwrites it with the command line)
#
# ``--python-version 3.13`` matches ``FROM python:3.13-slim``; the repo's other packages are not
# in scope because the image installs only this app. The ``[observability]`` extra is what the
# Dockerfile installs (WS-7 monitoring: the Prometheus /metrics endpoint).
#
# arm64: every pin above was checked for an installable ``cp313``/``abi3`` manylinux aarch64 wheel
# (or pure Python) with juniper-ml ``util/ad-hoc/2026-09-08_lock_wheel_availability.py --python 3.13
# --arch aarch64`` -- 31 pins, all OK. The image has no gcc and no Rust, so a pin with no matching
# binary wheel is a hard arm64 build failure. Re-run that pre-flight after regenerating.
#
# REGENERATED 2026-09-10, after the owner approved the six ``pypi`` environment gates.
# ``juniper-recurrence-model`` now pins **0.3.0** -- the release carrying decision 11's
# ``derive_full_split``, which ``sequence_data_from_arrays`` calls to rebuild the whole-dataset
# view on a post-juniper-data#369 artifact, and on which ``POST /v1/crossval`` depends -- and
# ``juniper-data-client`` moves 0.4.2 -> **0.5.0**. Those two are the ONLY pin changes; the count
# is unchanged at 31. The KNOWN STALENESS this header recorded at creation (2026-09-09, when
# 0.3.0 had been released but was still parked at the approval gate) is CLOSED.
