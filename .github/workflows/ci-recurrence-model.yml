---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-recurrence-model (subdirectory of juniper-recurrence)
# File Name:     ci-recurrence-model.yml
# Author:        Paul Calnon
#
# Date Created:  2026-06-14
#
# License:       MIT License
# Copyright:     Copyright (c) 2026 Paul Calnon
#
# Description:
#    CI pipeline for the juniper-recurrence-model package. Runs on PRs and
#    pushes that touch the package or this workflow. The future juniper-recurrence
#    application's own ci.yml will gate the service independently; this workflow
#    handles the model-package lifecycle (mirrors juniper-cascor's ci-protocol.yml).
#
#####################################################################################################################################################################################################

name: CI — juniper-recurrence-model

on:
  push:
    branches: [main, develop]
    paths:
      - "juniper-recurrence-model/**"
      - ".github/workflows/ci-recurrence-model.yml"
  pull_request:
    # Deliberately UNFILTERED (2026-08-12). Previously a `paths:` filter here meant the
    # whole workflow — gate included — never ran on a PR that did not touch this package,
    # so `Model required checks` could not be a required status check, so a PR breaking
    # this published package could merge with red CI. Path scoping now lives at the JOB
    # level via the `changes` job, so CI cost is unchanged but the gate reports on every
    # PR. `on.push` keeps its filter — a push has no base ref to diff against.
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel superseded in-flight runs of THIS workflow on the same ref. Keyed on
  # github.workflow so each path-scoped CI lane has its own group (lanes never
  # cancel each other); the publish workflows are deliberately excluded.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect model changes
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.filter.outputs.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect whether this PR touches the model package
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # push / workflow_dispatch keep the historical behaviour: `on.push` already
          # path-filters, and a push has no base ref to diff against.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            changed=true
          elif git diff --name-only "origin/${BASE_REF}...HEAD" \
               | grep -qE '^(juniper-recurrence-model/|\.github/workflows/ci-recurrence-model\.yml$)'; then
            changed=true
          else
            changed=false
          fi
          echo "model=${changed}" >> "$GITHUB_OUTPUT"
          echo "model package changed: ${changed}"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.model == 'true'
    defaults:
      run:
        working-directory: juniper-recurrence-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --upgrade "pip>=26.1.1" ruff

      - name: Ruff lint
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.model == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: juniper-recurrence-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: pip install --upgrade "pip>=26.1.1" && pip install -e ".[test]"

      - name: Run unit tests with coverage
        run: |
          python -m pytest --cov=juniper_recurrence_model --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90

      - name: Enforce per-file coverage gate (blocking; base lane)
        # Per-file coverage rollout C-5 (juniper-ml
        # notes/JUNIPER_ECOSYSTEM_PER_FILE_COVERAGE_ROLLOUT_SCOPING_2026-06-30.md):
        # exit 1 if any source file's statement coverage < 90 OR a packaged
        # sub-module's pooled (statement-weighted) coverage < 95. This BASE lane's
        # coverage.json measures every packaged file EXCEPT _readout_mlp.py, which
        # [tool.coverage.run].omit in pyproject.toml drops (the base no-torch job
        # never exercises the Rung 2b torch readout). The test-torch lane below
        # gates _readout_mlp.py via .coveragerc.torch's complementary report scope,
        # so the two lanes gate the UNION of source files with no file falling
        # through the crack between them.
        run: |
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"
          juniper-coverage-gap-map --coverage-json coverage.json --enforce

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: juniper-recurrence-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Smoke-test the built wheel (clean-venv import)
        run: |
          set -euo pipefail
          # F13/CI-5: install the BUILT WHEEL into a throwaway venv and import it, so a missing
          # module / package-data / MANIFEST gap is caught here — the editable install +
          # ``twine check`` never import the shipped artifact. Mirrors juniper-ml ci-model-core.yml.
          python -m venv /tmp/rec-model-smoke
          /tmp/rec-model-smoke/bin/pip install --quiet --upgrade pip
          /tmp/rec-model-smoke/bin/pip install --quiet dist/juniper_recurrence_model-*.whl
          /tmp/rec-model-smoke/bin/python -c "import juniper_recurrence_model as m; print('import OK', m.__version__); assert m.LMURegressor is not None"

  test-torch:
    name: Test — torch MLP readout (Rung 2b; optional [torch] extra)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.model == 'true'
    # Optional / non-gating (deliberately NOT in required-checks): the torch wheel adds ~1-3 GB, so it
    # is kept off the 3.12/3.13/3.14 base matrix and out of the required gate. It exercises the
    # importorskip-gated Rung 2b tests, which skip in the base no-torch job. Promote into
    # required-checks if torch-readout regressions should block merges.
    defaults:
      run:
        working-directory: juniper-recurrence-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package + test + torch extras
        run: pip install --upgrade "pip>=26.1.1" && pip install -e ".[test,torch]"

      - name: Run the Rung 2b (torch) readout tests with MLP-path coverage
        # Audit H2 / TEST-01: measure _readout_mlp.py coverage HERE (the base job omits it) and gate
        # at >=90, so the shipped readout="mlp" fit path can no longer regress green. Uses the same
        # PACKAGE-form --cov as the base job (.coveragerc.torch then scopes the report to _readout_mlp
        # via `include`); the dotted `--cov=...._readout_mlp` submodule form trips a numpy-2.x import
        # guard under coverage. Measured 95% locally.
        run: >-
          python -m pytest tests/test_readouts_mlp.py -ra -p no:dash -p no:playwright
          --cov=juniper_recurrence_model
          --cov-config=.coveragerc.torch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=90

      - name: Enforce per-file coverage gate (blocking; torch lane)
        # Per-file coverage rollout C-5 (juniper-ml
        # notes/JUNIPER_ECOSYSTEM_PER_FILE_COVERAGE_ROLLOUT_SCOPING_2026-06-30.md).
        # .coveragerc.torch's [report] include scopes this lane's coverage.json to
        # _readout_mlp.py (the base lane omits it), so this enforce run gates the
        # Rung 2b torch MLP readout: statement coverage >= 90 and its (single-file)
        # sub-module pooled >= 95. Complementary to the base-lane gate; together the
        # two lanes cover every packaged source file. This job is a required check,
        # so a regression in _readout_mlp.py blocks the merge.
        run: |
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"
          juniper-coverage-gap-map --coverage-json coverage.json --enforce

  required-checks:
    # Renamed from the bare "Required checks" (2026-08-12): ci-recurrence-app.yml and
    # ci-recurrence-client.yml BOTH emitted that same context name, so requiring it would
    # have been ambiguous about which workflow satisfied it. Each package lane now emits a
    # uniquely-named gate.
    name: Model required checks
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, lint, test, build]
    steps:
      - name: Verify required jobs succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "Changes: ${CHANGES}"
          echo "Lint:    ${LINT}"
          echo "Test:    ${TEST}"
          echo "Build:   ${BUILD}"

          # The detector must succeed. If it did not, we do NOT know whether the package
          # was touched, so reporting success would be exactly the hole this gate closes.
          if [[ "${CHANGES}" != "success" ]]; then
            echo "::error::change detection did not succeed — refusing to report a pass"
            exit 1
          fi

          # 'skipped' is a PASS here: this PR did not touch the model package, so the
          # package jobs correctly did not run. That is what lets this gate report on
          # EVERY PR and therefore be usable as a required status check.
          for result in "${LINT}" "${TEST}" "${BUILD}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "All required checks passed."
