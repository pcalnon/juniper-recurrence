---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-recurrence-client (subdirectory of juniper-recurrence)
# File Name:     ci-recurrence-client.yml
# Author:        Paul Calnon
#
# Date Created:  2026-06-18
#
# License:       MIT License
# Copyright:     Copyright (c) 2026 Paul Calnon
#
# Description:
#    CI pipeline for the juniper-recurrence-client package (the HTTP client for the
#    juniper-recurrence service). Runs on PRs and pushes that touch the package or this
#    workflow. Path-scoped so it gates independently of ci-recurrence-model.yml and
#    ci-recurrence-app.yml (the three subdir packages never overlap). Mirrors
#    ci-recurrence-model.yml.
#
#####################################################################################################################################################################################################

name: CI — juniper-recurrence-client

on:
  push:
    branches: [main, develop]
    paths:
      - "juniper-recurrence-client/**"
      - ".github/workflows/ci-recurrence-client.yml"
  pull_request:
    # Deliberately UNFILTERED (2026-08-12). Previously a `paths:` filter here meant the
    # whole workflow — gate included — never ran on a PR that did not touch this package,
    # so `Client required checks` could not be a required status check, so a PR breaking
    # this published package could merge with red CI. Path scoping now lives at the JOB
    # level via the `changes` job, so CI cost is unchanged but the gate reports on every
    # PR. `on.push` keeps its filter — a push has no base ref to diff against.
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel superseded in-flight runs of THIS workflow on the same ref. Keyed on
  # github.workflow so each path-scoped CI lane has its own group (lanes never
  # cancel each other); the publish workflows are deliberately excluded.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect client changes
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect whether this PR touches the client package
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # push / workflow_dispatch keep the historical behaviour: `on.push` already
          # path-filters, and a push has no base ref to diff against.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            changed=true
          elif git diff --name-only "origin/${BASE_REF}...HEAD" \
               | grep -qE '^(juniper-recurrence-client/|\.github/workflows/ci-recurrence-client\.yml$)'; then
            changed=true
          else
            changed=false
          fi
          echo "client=${changed}" >> "$GITHUB_OUTPUT"
          echo "client package changed: ${changed}"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.client == 'true'
    defaults:
      run:
        working-directory: juniper-recurrence-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --upgrade "pip>=26.1.1" ruff

      - name: Ruff lint
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.client == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: juniper-recurrence-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: pip install --upgrade "pip>=26.1.1" && pip install -e ".[test]"

      - name: Run unit tests with coverage
        run: |
          python -m pytest --cov=juniper_recurrence_client --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90

      - name: Enforce per-file coverage gate (blocking)
        # Per-file coverage rollout C-5 (juniper-ml
        # notes/JUNIPER_ECOSYSTEM_PER_FILE_COVERAGE_ROLLOUT_SCOPING_2026-06-30.md):
        # exit 1 if any source file's statement coverage < 90 OR a
        # sub-module's pooled (statement-weighted) coverage < 95.
        run: |
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"
          juniper-coverage-gap-map --coverage-json coverage.json --enforce

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: juniper-recurrence-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Smoke-test the built wheel (clean-venv import)
        run: |
          set -euo pipefail
          # F13/CI-5: install the BUILT WHEEL into a throwaway venv and import it, so a missing
          # module / package-data / MANIFEST gap is caught here — the editable install +
          # ``twine check`` never import the shipped artifact. Mirrors juniper-ml ci-model-core.yml.
          python -m venv /tmp/rec-client-smoke
          /tmp/rec-client-smoke/bin/pip install --quiet --upgrade pip
          /tmp/rec-client-smoke/bin/pip install --quiet dist/juniper_recurrence_client-*.whl
          /tmp/rec-client-smoke/bin/python -c "import juniper_recurrence_client as m; print('import OK', m.__version__); assert m.JuniperRecurrenceClient is not None"

  required-checks:
    # Renamed from the bare "Required checks" (2026-08-12): ci-recurrence-app.yml and
    # ci-recurrence-model.yml BOTH emitted that same context name, so requiring it would
    # have been ambiguous about which workflow satisfied it. Each package lane now emits a
    # uniquely-named gate.
    name: Client required checks
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, lint, test, build]
    steps:
      - name: Verify required jobs succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "Changes: ${CHANGES}"
          echo "Lint:    ${LINT}"
          echo "Test:    ${TEST}"
          echo "Build:   ${BUILD}"

          # The detector must succeed. If it did not, we do NOT know whether the package
          # was touched, so reporting success would be exactly the hole this gate closes.
          if [[ "${CHANGES}" != "success" ]]; then
            echo "::error::change detection did not succeed — refusing to report a pass"
            exit 1
          fi

          # 'skipped' is a PASS here: this PR did not touch the client package, so the
          # package jobs correctly did not run. That is what lets this gate report on
          # EVERY PR and therefore be usable as a required status check.
          for result in "${LINT}" "${TEST}" "${BUILD}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "All required checks passed."
