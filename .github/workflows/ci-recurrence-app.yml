---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-recurrence (application subdirectory of juniper-recurrence)
# File Name:     ci-recurrence-app.yml
# Author:        Paul Calnon
#
# Date Created:  2026-06-16
#
# License:       MIT License
# Copyright:     Copyright (c) 2026 Paul Calnon
#
# Description:
#    CI pipeline for the juniper-recurrence application package (the FastAPI + CLI
#    service). The model package has its own ci-recurrence-model.yml.
#
#    PATH SCOPING LIVES AT THE JOB LEVEL, NOT THE WORKFLOW LEVEL (2026-08-12).
#    Previously `on.pull_request` carried a `paths:` filter, so on a PR that did not
#    touch the app the workflow never ran and NO context was reported — which meant
#    `App required checks` could not be made a required status check, which meant a PR
#    breaking this published package could merge with red CI. The workflow now triggers
#    on every PR to main; the `changes` job decides whether the package was touched and
#    the expensive jobs skip when it was not, so CI cost is unchanged. The gate runs
#    `if: always()` and treats `skipped` as a pass, so it reports on EVERY PR and can be
#    required. `on.push` keeps its path filter — a push has no base ref to diff against.
#
#    Rationale + fleet context: juniper-ml
#    notes/JUNIPER_2026-08-10_JUNIPER-ECOSYSTEM_REQUIRED-STATUS-CHECK-CONTEXT-LISTS.md
#
#####################################################################################################################################################################################################

name: CI — juniper-recurrence-app

on:
  push:
    branches: [main, develop, "feature/**", "feat/**", "fix/**", "chore/**"]
    paths:
      - "juniper-recurrence/**"
      - ".github/workflows/ci-recurrence-app.yml"
  pull_request:
    # Deliberately UNFILTERED — see the header. Job-level gating is in `changes`.
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel superseded in-flight runs of THIS workflow on the same ref. Keyed on
  # github.workflow so each path-scoped CI lane has its own group (lanes never
  # cancel each other); the publish workflows are deliberately excluded.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect whether this PR touches the app package
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # push / workflow_dispatch keep the historical behaviour: `on.push` already
          # path-filters, and a push has no base ref to diff against.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            changed=true
          elif git diff --name-only "origin/${BASE_REF}...HEAD" \
               | grep -qE '^(juniper-recurrence/|\.github/workflows/ci-recurrence-app\.yml$)'; then
            changed=true
          else
            changed=false
          fi
          echo "app=${changed}" >> "$GITHUB_OUTPUT"
          echo "app package changed: ${changed}"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    defaults:
      run:
        working-directory: juniper-recurrence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --upgrade "pip>=26.1.1" ruff

      - name: Ruff lint
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: juniper-recurrence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        # The [test] extra self-references [observability], so this alone pulls the
        # metrics / structured-JSON deps (no more importorskip-driven skips of
        # test_metrics.py / test_obs04_metrics.py / test_logging.py) — the per-file
        # coverage rollout C-5 pre-gate fix (juniper-ml scoping doc 2026-06-30).
        run: pip install --upgrade "pip>=26.1.1" && pip install -e ".[test]"

      - name: Run unit tests with coverage
        run: |
          python -m pytest --cov=juniper_recurrence --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90

      - name: Enforce per-file coverage gate (blocking)
        # Per-file coverage rollout C-5 (juniper-ml
        # notes/JUNIPER_ECOSYSTEM_PER_FILE_COVERAGE_ROLLOUT_SCOPING_2026-06-30.md):
        # exit 1 if any source file's statement coverage < 90 OR a
        # sub-module's pooled (statement-weighted) coverage < 95.
        run: |
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"
          juniper-coverage-gap-map --coverage-json coverage.json --enforce

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: juniper-recurrence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Smoke-test the built wheel (clean-venv import)
        run: |
          set -euo pipefail
          # F13/CI-5: install the BUILT WHEEL into a throwaway venv and import it — incl. the
          # FastAPI app factory — so a missing module / package-data / MANIFEST gap is caught
          # here. The editable install + ``twine check`` never import the shipped artifact.
          # Mirrors juniper-ml ci-model-core.yml.
          python -m venv /tmp/rec-app-smoke
          /tmp/rec-app-smoke/bin/pip install --quiet --upgrade pip
          /tmp/rec-app-smoke/bin/pip install --quiet dist/juniper_recurrence-*.whl
          /tmp/rec-app-smoke/bin/python -c "import juniper_recurrence as m; from juniper_recurrence.app import build_app; print('import OK', m.__version__); assert build_app is not None"

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: juniper-recurrence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build image
        run: docker build -t juniper-recurrence:ci .

      - name: Smoke test — serve + /v1/health
        run: |
          docker run -d --name rec-ci -p 8210:8210 juniper-recurrence:ci
          # The app imports a heavy pure-Python stack (service-core, model-core,
          # recurrence-model, data-client, numpy, fastapi) — ~10-15s — before
          # uvicorn binds, so retry generously. --retry-all-errors also retries
          # non-2xx; -f makes curl exit non-zero if /v1/health never returns 200.
          if ! curl --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors -fsS \
                 http://localhost:8210/v1/health; then
            echo "::error::recurrence container did not become healthy"
            docker logs rec-ci || true
            docker rm -f rec-ci || true
            exit 1
          fi
          echo ""
          echo "smoke test OK: /v1/health -> 200"
          docker rm -f rec-ci

  required-checks:
    # Renamed from the bare "Required checks" (2026-08-12): ci-recurrence-client.yml
    # and ci-recurrence-model.yml BOTH emitted that same context name, so requiring it
    # would have been ambiguous about which workflow satisfied it. Each package lane
    # now emits a uniquely-named gate.
    name: App required checks
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, lint, test, build, docker]
    steps:
      - name: Verify required jobs succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          echo "Changes: ${CHANGES}"
          echo "Lint:    ${LINT}"
          echo "Test:    ${TEST}"
          echo "Build:   ${BUILD}"
          echo "Docker:  ${DOCKER}"

          # The detector must succeed. If it did not, we do NOT know whether the package
          # was touched, so reporting success would be exactly the hole this gate closes.
          if [[ "${CHANGES}" != "success" ]]; then
            echo "::error::change detection did not succeed — refusing to report a pass"
            exit 1
          fi

          # 'skipped' is a PASS here: this PR did not touch the app package, so the
          # package jobs correctly did not run. That is what lets this gate report on
          # EVERY PR and therefore be usable as a required status check.
          for result in "${LINT}" "${TEST}" "${BUILD}" "${DOCKER}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "All required checks passed."
