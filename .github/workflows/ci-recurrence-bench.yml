---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-recurrence (repo root, bench/ harness — Δt-thesis benchmark suite)
# File Name:     ci-recurrence-bench.yml
# Author:        Paul Calnon
#
# Date Created:  2026-06-21
#
# License:       MIT License
# Copyright:     Copyright (c) 2026 Paul Calnon
#
# Description:
#    CI pipeline for the bench/ evaluation harness (the Δt-proof benchmark smoke
#    suite). The harness is a standalone, unpublished directory at the repo root
#    (import name `bench`), so it is gated by its own path-scoped workflow rather
#    than a sub-package CI. The job installs the app's [test,bench] extras — which
#    resolve juniper-recurrence-model, juniper-model-core[crossval], and the
#    juniper-data generators from PyPI — then runs the suite from the checkout root
#    so `import bench` resolves. Closes audit finding TST-1: bench/test_bench_smoke.py
#    (6 tests guarding the Δt thesis) previously ran in no CI lane, because the app
#    CI runs in working-directory juniper-recurrence/ with testpaths=["tests"] and
#    bench/ is a sibling of that directory.
#
#    A path-scoped lane cannot see a break that arrives through a dependency (#178:
#    decision 11 broke all seven bench datasets and every run for 15 days reported
#    success, because the matrix never ran). Two triggers close that:
#      - `repository_dispatch: juniper-data-published`, fired by juniper-data's
#        publish workflow after a release reaches PyPI. The run tests the bench against
#        the EXACT dispatched version, past the [bench] cap if need be, so a release
#        that would break the bench is known before anyone raises the cap to admit it.
#      - `juniper-recurrence/pyproject.toml` in the path filter: the [bench] extras,
#        and therefore the juniper-data version the bench resolves, are declared there.
#        #179 raised that cap to admit juniper-data 0.15.0 and the matrix was skipped.
#
#####################################################################################################################################################################################################

name: CI — bench harness

on:
  push:
    # Parity with the per-package ci-recurrence-*.yml lanes (audit CI-04): the bench lane previously
    # push-triggered only on main, so bench changes on a working branch got no push CI before the PR.
    branches: [main, develop]
    paths:
      - "bench/**"
      - ".github/workflows/ci-recurrence-bench.yml"
      # The [bench] extras live here, so a pin change moves what the bench installs.
      - "juniper-recurrence/pyproject.toml"
  pull_request:
    # Deliberately UNFILTERED (2026-08-12). Previously a `paths:` filter here meant the
    # whole workflow — gate included — never ran on a PR that did not touch bench, so
    # `Bench required checks` could not be a required status check. Path scoping now lives
    # at the JOB level via the `changes` job, so CI cost is unchanged but the gate reports
    # on every PR. `on.push` keeps its filter — a push has no base ref to diff against.
    branches: [main]
  workflow_dispatch:
  # juniper-data's notify-consumers workflow, after a release reaches PyPI (#178).
  # client_payload: {source, version, sha}. Runs on the default branch.
  repository_dispatch:
    types: [juniper-data-published]

concurrency:
  # Cancel superseded in-flight runs of THIS workflow on the same ref. Keyed on
  # github.workflow so each path-scoped CI lane has its own group (lanes never
  # cancel each other); the publish workflows are deliberately excluded.
  # Also keyed on the event: a dispatch run and a push run both land on main, and
  # without this a push touching bench/ cancels the release check in flight.
  # A dispatch run is also keyed on the RELEASED VERSION (#178). Every dispatch lands on
  # main with the same event name, so without it a second release, or a manual
  # re-announce while the first run waits out PyPI's CDN lag, cancelled the first
  # release's check and nothing fired it again. Two dispatches of the same version still
  # share a group. The later one supersedes the earlier, which tested the same thing. For
  # every other event the payload is absent and the last segment is empty.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.client_payload.version || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect bench changes
    runs-on: ubuntu-latest
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect whether this PR touches bench
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # push / workflow_dispatch keep the historical behaviour: `on.push` already
          # path-filters, and a push has no base ref to diff against. A
          # repository_dispatch is a dependency release: always run.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            changed=true
          elif git diff --name-only "origin/${BASE_REF}...HEAD" \
               | grep -qE '^(bench/|\.github/workflows/ci-recurrence-bench\.yml$|juniper-recurrence/pyproject\.toml$)'; then
            changed=true
          else
            changed=false
          fi
          echo "bench=${changed}" >> "$GITHUB_OUTPUT"
          echo "bench changed: ${changed}"

  test:
    name: Bench smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.bench == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # A dispatch fires when the publish job finishes, which can beat the new version
      # onto PyPI's CDN. Wait until it is actually installable rather than quietly
      # testing the previous release. Payload values reach the shell only through env.
      - name: Wait for the dispatched juniper-data release to be installable
        if: github.event_name == 'repository_dispatch'
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::client_payload.version must be a plain X.Y.Z release, got '${VERSION}'"
            exit 1
          fi
          probe="$(mktemp -d)"
          for attempt in $(seq 1 30); do
            if pip download --no-deps --only-binary=:all: --quiet --dest "${probe}" "juniper-data==${VERSION}"; then
              echo "juniper-data ${VERSION} is installable (attempt ${attempt})"
              exit 0
            fi
            sleep 20
          done
          echo "::error::juniper-data ${VERSION} did not become installable from PyPI within 10 minutes"
          exit 1

      # bench/ is imported from the checkout root (not installed); its runtime deps
      # come from the app's [bench] extra (juniper-data generators) plus the app's
      # own pins (juniper-recurrence-model, juniper-model-core[crossval]) and [test]
      # (pytest). Installing the app from its subdirectory resolves all of these from
      # PyPI; the harness code itself stays at the repo root.
      # [bench-plots] is included so bench/test_plots.py EXECUTES rather than skipping: its
      # matplotlib guard is a skipif, so omitting the extra would turn the G-5 plotting module
      # into untested code that still reports a green lane. Small pure wheel, no network.
      - name: Install app extras for the bench harness
        run: |
          pip install --upgrade "pip>=26.1.1"
          pip install "./juniper-recurrence[test,bench,bench-plots]"

      # On a dispatch, test the version that was released, not the one the [bench] cap
      # happens to admit. A cap that excludes it keeps consumers safe today; this run
      # says whether lifting the cap would break the bench, before anyone lifts it.
      # pip installs past an extra's cap silently -- neither the install nor `pip check`
      # re-evaluates a requirement conditional on an extra (measured, pip 26.2.1) -- so
      # the version assertion below is the only check that the swap took effect.
      - name: Pin the dispatched juniper-data release
        if: github.event_name == 'repository_dispatch'
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          resolved="$(python -c 'import importlib.metadata as m; print(m.version("juniper-data"))')"
          if [[ "${resolved}" != "${VERSION}" ]]; then
            echo "::notice::the [bench] pin resolved juniper-data ${resolved}; installing the dispatched ${VERSION} over it. juniper-recurrence[bench] consumers do not get ${VERSION} until that pin admits it."
            pip install "juniper-data==${VERSION}"
          fi
          tested="$(python -c 'import importlib.metadata as m; print(m.version("juniper-data"))')"
          if [[ "${tested}" != "${VERSION}" ]]; then
            echo "::error::asked for juniper-data ${VERSION}, but ${tested} is installed"
            exit 1
          fi
          {
            echo "### juniper-data-published: ${VERSION}"
            echo ""
            echo "- tested against: \`juniper-data ${tested}\` (source sha \`${SOURCE_SHA}\`)"
            echo "- the \`[bench]\` pin alone resolves: \`${resolved}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Run from the repo root (python -m puts the cwd on sys.path so `import bench`
      # resolves); -p no:dash/playwright is the ecosystem-standard autoload-SIGSEGV
      # guard. test_bench_smoke.py importorskips juniper_data, which the [bench]
      # extra provides, so the suite actually executes rather than skipping.
      - name: Run bench smoke suite
        run: python -m pytest bench/ -ra -p no:dash -p no:playwright

  # Branch-protection-stable aggregate (audit CI-07): the matrix `test` job fans out to one check per
  # Python version, whose names shift when the matrix changes -- awkward to pin as required checks. This
  # single job depends on the whole matrix (a matrix job's `result` is `success` only when every leg
  # succeeds), so branch protection can require one stable check for the bench lane. `if: always()` so
  # it runs even when `test` fails and reports that failure rather than being skipped. Mirrors the
  # `required-checks` aggregate in ci-recurrence-app.yml; named distinctly so the two never collide.
  required-checks:
    name: Bench required checks
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, test]
    steps:
      - name: Verify the bench smoke matrix succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "Changes:     ${CHANGES}"
          echo "Bench smoke: ${TEST}"

          # The detector must succeed. If it did not, we do NOT know whether bench was
          # touched, so reporting success would be exactly the hole this gate closes.
          if [[ "${CHANGES}" != "success" ]]; then
            echo "::error::change detection did not succeed — refusing to report a pass"
            exit 1
          fi

          # 'skipped' is a PASS here: this PR did not touch bench, so the smoke matrix
          # correctly did not run. That is what lets this gate report on EVERY PR and
          # therefore be usable as a required status check.
          if [[ "${TEST}" != "success" && "${TEST}" != "skipped" ]]; then
            echo "::error::the bench smoke suite did not succeed"
            exit 1
          fi
          echo "All bench required checks passed."
